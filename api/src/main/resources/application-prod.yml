spring:
  datasource:
    # Required in production. No localhost fallback: startup fails if DB_URL is absent.
    # Example: aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require
    url: jdbc:postgresql://${DB_URL}
    username: ${DB_USER}
    password: ${DB_PWD}
    hikari:
      pool-name: CmmsApiPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      # Supavisor closes idle session-mode client connections; ping well before that
      # so Hikari never hands out an already-closed connection.
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 30000
      data-source-properties:
        ApplicationName: cmms-api
        sslmode: require
        tcpKeepAlive: true
        connectTimeout: 10
  liquibase:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
